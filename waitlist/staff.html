<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>員工管理｜海大餐廳</title><link rel="stylesheet" href="style.css"><script src="app.js" defer></script></head><body data-page="staff"><header><span class="brand">海大餐廳</span><span>員工管理</span></header><main class="wide"><section class="staff-heading"><div><p class="eyebrow">STAFF CONSOLE</p><h1>候位管理</h1><p>查看候位、通知顧客與管理入座。</p></div><a href="index.html">返回顧客頁 ↗</a></section><section id="login-card" class="card narrow"><h2>員工登入</h2><p>輸入員工密碼以查看候位資料。</p><form id="login-form"><label>員工密碼<input type="password" name="key" required autocomplete="current-password"></label><button>登入</button></form></section><section id="dashboard" hidden><div class="toolbar"><div><h2>目前候位</h2><p>每 5 秒自動更新</p></div><div><button id="refresh" class="secondary">重新整理</button> <button id="logout" class="text-button">登出</button></div></div><div id="stats" class="stats"></div><div class="card table-card"><div class="table-wrap"><table><thead><tr><th>號碼</th><th>姓名</th><th>性別</th><th>人數</th><th>電子郵件</th><th>候位時間</th><th>狀態</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table></div><p id="empty" hidden>目前沒有候位。</p></div><details><summary>事件紀錄</summary><p>僅顯示最近 60 筆，不包含姓名及信箱。</p><button id="show-log" class="secondary">讀取紀錄</button><pre id="log"></pre></details></section><p id="message" class="message" role="status" aria-live="polite"></p></main><footer>海大餐廳 · 候位系統</footer></body></html>
