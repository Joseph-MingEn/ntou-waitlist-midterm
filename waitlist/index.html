<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>海大餐廳｜線上候位</title><link rel="stylesheet" href="style.css"><script src="app.js" defer></script></head>
<body data-page="customer"><header><span class="brand">海大餐廳</span><span>線上候位</span></header><main><section class="hero"><p class="eyebrow">WAITLIST · 候位服務</p><h1>好好用餐，<br>從容等候。</h1><p>留下資料取得候位號碼，輪到您時會收到電子郵件通知。</p><div class="count">目前候位 <strong id="count">—</strong> 組</div></section><section class="card" id="join-card"><h2>加入候位</h2><p>請填寫聯絡資料，以便輪到時通知您。</p><form id="join-form"><label>姓名<input name="name" maxlength="60" required autocomplete="name"></label><label>性別<select name="gender" required><option value="">請選擇</option><option>男</option><option>女</option><option>其他</option><option>不願透露</option></select></label><label>電子郵件<input name="email" type="email" maxlength="254" required autocomplete="email"></label><label>用餐人數<input name="partySize" type="number" min="1" max="20" value="2" required></label><button type="submit">取得候位號碼 <span aria-hidden="true">→</span></button></form><p class="hint">請勿清除瀏覽器資料，票證保存在此裝置。測試時請使用自己或同組同學的信箱。</p></section><section class="card ticket" id="ticket" hidden><p class="eyebrow">YOUR NUMBER</p><h2>您的候位號碼</h2><strong id="ticket-id" class="ticket-number">—</strong><div class="ticket-grid"><div>前方還有<strong id="ahead">—</strong>組</div><div>目前狀態<strong id="status">—</strong></div></div><p class="hint">畫面每 5 秒更新。請保留此頁，輪到時也會寄送通知。</p><button id="cancel-self" class="secondary">取消我的候位</button><button id="forget" class="text-button" hidden>清除此裝置的票證</button></section><p id="message" class="message" role="status" aria-live="polite"></p></main><footer>海大餐廳 · 候位系統 <a href="staff.html">員工管理</a></footer></body></html>
